version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gocritic
    - gosec
    - gocyclo
    - err113
    - bodyclose
    - noctx
    - unparam
    - revive
    - misspell
    - prealloc
    - errname
    - errorlint
    - nilerr
    - nilnil
    - wastedassign
    - maintidx
    - godox
    - goprintffuncname
    - whitespace

formatters:
  enable:
    - gofmt
    - goimports