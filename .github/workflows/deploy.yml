name: Deploy to AWS EC2 with Docker

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  deploy:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: |
          docker build --no-cache -t caisaara-backend:latest .
          docker save -o caisaara-backend.tar caisaara-backend:latest
          chmod 644 caisaara-backend.tar

      - name: Copy Docker Image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "caisaara-backend.tar"
          target: "/home/${{ secrets.EC2_USERNAME }}/app"

      - name: Deploy Docker Containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e

            APP_DIR="/home/${{ secrets.EC2_USERNAME }}/app"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            printf '%s\n' "$ENV_FILE_CONTENT" > .env
            chmod 600 .env

            # Keep the currently running image as a rollback target
            if docker ps -a --format '{{.Names}}' | grep -q '^caisaara-backend$'; then
              docker tag "$(docker inspect --format '{{.Image}}' caisaara-backend)" caisaara-backend:previous
            fi

            docker load -i caisaara-backend.tar
            rm -f caisaara-backend.tar

            # Start Redis if it does not exist (localhost only)
            if ! docker ps -a --format '{{.Names}}' | grep -q '^redis$'; then
              docker run -d \
                --name redis \
                --restart unless-stopped \
                --network host \
                redis:7-alpine \
                redis-server --bind 127.0.0.1
              echo "Redis container started"
            else
              docker start redis || true
              echo "Redis already running or started"
            fi

            # Postgres is created once by hand on the server; make sure it is up
            if ! docker ps -a --format '{{.Names}}' | grep -q '^postgres$'; then
              echo "Postgres container not found on the server"
              exit 1
            fi
            docker start postgres || true

            echo "Waiting for Postgres to be ready..."
            for i in $(seq 1 30); do
              if docker exec postgres pg_isready -U caisaara -d caisaara > /dev/null 2>&1; then
                echo "Postgres is ready after ${i}s"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "Postgres not ready after 30s"
                docker logs postgres --tail 50
                exit 1
              fi
              sleep 1
            done

            start_backend() {
              docker stop caisaara-backend || true
              docker rm caisaara-backend || true
              docker run -d \
                --name caisaara-backend \
                --restart unless-stopped \
                --env-file .env \
                --network host \
                -e GIN_MODE=release \
                "$1"
            }

            wait_healthy() {
              for i in $(seq 1 30); do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8050/health || true)
                if [ "$STATUS" = "200" ]; then
                  echo "Container is healthy after ${i}s"
                  return 0
                fi
                sleep 1
              done
              return 1
            }

            start_backend caisaara-backend:latest

            echo "Waiting for container to be healthy..."
            if ! wait_healthy; then
              echo "Container health check failed after 30s"
              docker logs caisaara-backend --tail 50
              if docker image inspect caisaara-backend:previous > /dev/null 2>&1; then
                echo "Rolling back to previous version"
                start_backend caisaara-backend:previous
                wait_healthy || echo "Rollback health check also failed"
              fi
              exit 1
            fi

            docker image prune -f

            docker ps --filter "name=caisaara-backend" --filter "name=redis" --filter "name=postgres"
