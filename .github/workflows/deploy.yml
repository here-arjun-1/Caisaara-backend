name: Deploy to AWS EC2 with Docker

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  deploy:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t caisaara-backend:latest .
          docker save -o caisaara-backend.tar caisaara-backend:latest
          chmod 644 caisaara-backend.tar

      - name: Copy image and compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "caisaara-backend.tar,compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e
            cd "/home/${{ secrets.EC2_USERNAME }}/app"

            printf '%s\n' "$ENV_FILE_CONTENT" > .env
            chmod 600 .env

            if docker image inspect caisaara-backend:latest > /dev/null 2>&1; then
              docker tag caisaara-backend:latest caisaara-backend:previous
            fi

            docker load -i caisaara-backend.tar
            rm -f caisaara-backend.tar

            if ! docker compose up -d --no-build --wait --wait-timeout 120; then
              echo "Deploy failed, rolling back"
              docker compose logs backend --tail 50
              if docker image inspect caisaara-backend:previous > /dev/null 2>&1; then
                docker tag caisaara-backend:previous caisaara-backend:latest
                docker compose up -d --no-build --wait --wait-timeout 60 backend || echo "Rollback also failed"
              fi
              exit 1
            fi

            docker image prune -f
            docker compose ps
